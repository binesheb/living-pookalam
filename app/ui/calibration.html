<!doctype html><html><head><meta charset='utf-8'><title>Floor Calibration</title><style>body{font-family:system-ui;margin:20px;background:#111;color:#eee}canvas{max-width:100%;border:1px solid #555;cursor:crosshair}button,select,input{padding:8px;margin:4px}.row{margin:10px 0}</style></head><body><h2>Live Floor Calibration</h2><div class='row'><select id='camera'></select><button onclick='refreshCameras()'>Refresh</button><button onclick='startCamera()'>Start Preview</button></div><p id='step'>Click 1: Top-left</p><video id='video' autoplay playsinline style='display:none'></video><canvas id='canvas'></canvas><div class='row'><label>Width mm <input id='w' value='2000' type='number'></label><label>Height mm <input id='h' value='1500' type='number'></label></div><button onclick='undo()'>Undo</button><button onclick='resetPins()'>Reset</button><button onclick='save()'>Save Floor Area</button><pre id='status'></pre><script>const v=document.querySelector('#video'),c=document.querySelector('#canvas'),x=c.getContext('2d');let pts=[],drag=-1,raf;async function refreshCameras(){let d=await fetch('/api/v1/cameras').then(r=>r.json());camera.innerHTML=d.cameras.map(z=>`<option value="${z.index}">${z.label}</option>`).join('')}async function startCamera(){if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());let id=camera.value;v.srcObject=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:id}}});await v.play();c.width=v.videoWidth;c.height=v.videoHeight;draw()}function draw(){if(v.readyState>=2)x.drawImage(v,0,0,c.width,c.height);x.strokeStyle='#00ff66';x.lineWidth=3;if(pts.length){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));if(pts.length===4)x.closePath();x.stroke()}pts.forEach((p,i)=>{x.fillStyle='#ff3333';x.beginPath();x.arc(p.x,p.y,9,0,Math.PI*2);x.fill();x.fillStyle='white';x.fillText(i+1,p.x+12,p.y-12)});step.textContent=pts.length<4?`Click ${pts.length+1}: ${['Top-left','Top-right','Bottom-right','Bottom-left'][pts.length]}`:'Drag pins to fine-adjust, then Save';raf=requestAnimationFrame(draw)}function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onmousedown=e=>{let p=pos(e);drag=pts.findIndex(q=>Math.hypot(q.x-p.x,q.y-p.y)<18);if(drag<0&&pts.length<4)pts.push(p)};c.onmousemove=e=>{if(drag>=0)pts[drag]=pos(e)};c.onmouseup=()=>drag=-1;function undo(){pts.pop()}function resetPins(){pts=[]}async function save(){if(pts.length!==4)return status.textContent='Select all four corners first';let r=await fetch('/api/v1/calibration/manual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:pts.map(p=>({x:p.x,y:p.y})),physical_width_mm:+w.value,physical_height_mm:+h.value})});status.textContent=await r.text()}refreshCameras()</script></body></html>
