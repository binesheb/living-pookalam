name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Smoke import non-GUI modules
        run: python -c "import auto_calibration, discovery_overlay, effects, pookalam_vision"
      - name: Validate runtime metadata
        run: python -c "from pathlib import Path; v=Path('version.txt').read_text().strip(); assert v, 'version.txt is empty'; print(v)"
