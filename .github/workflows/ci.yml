name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Import critical modules
        run: python -c "from app.calibration.engine import LiveCalibrator; from app.rendering.compositor import build_projection_mask; from app.visuals.engine import VisualEngine; from app.ui.experience_field import install; print('critical imports OK')"
      - name: Test suite
        run: pytest -q
